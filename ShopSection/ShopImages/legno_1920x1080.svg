<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Base wood color gradient -->
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="20%" stop-color="#7c4f2c"/>
      <stop offset="45%" stop-color="#96693e"/>
      <stop offset="70%" stop-color="#7c4f2c"/>
      <stop offset="100%" stop-color="#8a5a34"/>
    </linearGradient>

    <!-- Wood grain turbulence filter -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35
                0 0 0 0 0.22
                0 0 0 0 0.10
                0 0 0 0.55 0" result="grainColor"/>
      <feComposite in="grainColor" in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- Finer fibre detail -->
    <filter id="fibre" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="2" seed="21" result="fibreNoise"/>
      <feColorMatrix in="fibreNoise" type="matrix"
        values="0 0 0 0 0.25
                0 0 0 0 0.14
                0 0 0 0 0.06
                0 0 0 0.12 0"/>
    </filter>

    <!-- Vignette for depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>

    <!-- Soft top light sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Base panel -->
  <rect width="1920" height="1080" fill="url(#woodBase)"/>

  <!-- Grain layer -->
  <rect width="1920" height="1080" fill="#6b431f" filter="url(#grain)" opacity="0.9"/>

  <!-- Fine fibre layer -->
  <rect width="1920" height="1080" fill="#5a3618" filter="url(#fibre)" opacity="0.5"/>

  <!-- Plank seams -->
  <g stroke="#3f2513" stroke-opacity="0.35" stroke-width="3">
    <line x1="0" y1="216" x2="1920" y2="216"/>
    <line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/>
    <line x1="0" y1="864" x2="1920" y2="864"/>
  </g>
  <g stroke="#c99a67" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="217" x2="1920" y2="217"/>
    <line x1="0" y1="433" x2="1920" y2="433"/>
    <line x1="0" y1="649" x2="1920" y2="649"/>
    <line x1="0" y1="865" x2="1920" y2="865"/>
  </g>

  <!-- Light sheen -->
  <rect width="1920" height="1080" fill="url(#sheen)"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
