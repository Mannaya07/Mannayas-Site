    <script>

        /* Elenco delle immagini */

        const vxPhotos_42 = [
            "ShopImages/dee.png",
            "ShopImages/20260320_222240.png",
            "ShopImages/20260227_173527.png",
            "ShopImages/PcWinXpP.png"
        ];

        let vxCurrent_42 = 0;


        /* per arprie le foto*/

        function vxOpen_42(numero) {

            vxCurrent_42 = numero;

            document.getElementById("vxMainImage_42").src =
                vxPhotos_42[vxCurrent_42];

            document.getElementById("vxBox_42").style.display = "flex";
        }


        /* questro semplicemnte per chiduerle */

        function vxClose_42() {

            document.getElementById("vxBox_42").style.display = "none";
        }


        /* con codesto cambi fotoO */

        function vxChange_42(direzione) {

            vxCurrent_42 += direzione;


            /* Se arrivi alla fine torna alla prima */

            if (vxCurrent_42 >= vxPhotos_42.length) {
                vxCurrent_42 = 0;
            }


            /* Se vai indietro dalla prima vai all'ultima */

            if (vxCurrent_42 < 0) {
                vxCurrent_42 = vxPhotos_42.length - 1;
            }


            document.getElementById("vxMainImage_42").src =
                vxPhotos_42[vxCurrent_42];
        }


        /* Chiudi cliccando sullo sfondo */

        document.getElementById("vxBox_42").addEventListener("click", function(event) {

            if (event.target === this) {
                vxClose_42();
            }

        });


        /* Frecce della tastiera */

        document.addEventListener("keydown", function(event) {

            if (document.getElementById("vxBox_42").style.display === "flex") {

                if (event.key === "ArrowRight") {
                    vxChange_42(1);
                }

                if (event.key === "ArrowLeft") {
                    vxChange_42(-1);
                }

                if (event.key === "Escape") {
                    vxClose_42();
                }

            }

        });


function ms(n) {
